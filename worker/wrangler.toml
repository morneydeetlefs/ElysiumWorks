# ══════════════════════════════════════════════════════════════
# ELYSIUM WORKS — Cloudflare Worker
# wrangler.toml
# ══════════════════════════════════════════════════════════════

name       = "elysium-works-api"
main       = "src/index.js"
compatibility_date = "2024-09-23"

# ── D1 DATABASE ───────────────────────────────────────────────
# After running: wrangler d1 create elysium-works-db
# Copy the database_id from the output and paste it below.
[[d1_databases]]
binding       = "DB"
database_name = "elysium-works-db"
database_id   = "PASTE_YOUR_D1_DATABASE_ID_HERE"

# ── ENVIRONMENT VARIABLES ─────────────────────────────────────
# Set these as SECRET environment variables in the Cloudflare
# dashboard (Worker → Settings → Variables → Add variable).
# Do NOT put real values here — this file goes to GitHub.
#
# Required secrets:
#   ADMIN_PIN   — your numeric or text PIN (e.g. "7823")
#   JWT_SECRET  — any long random string (e.g. 32+ random chars)
#
# To generate a good JWT_SECRET run:
#   openssl rand -base64 32
# Or use: https://generate-secret.vercel.app/32

# ── ROUTES ───────────────────────────────────────────────────
# This makes your Worker answer at:
#   https://elysiumworks.pages.dev/api/*
# You need to add a custom domain or Pages Function redirect.
# Simpler: just use the worker.dev URL for now and update
# WORKER_URL in app.html accordingly.

# ── PRODUCTION ENVIRONMENT ────────────────────────────────────
[env.production]
name = "elysium-works-api"
